name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      REMOTE_PATH: /datos/site
      SSH_USER: ubuntu
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$VPS_HOST" \
            "sudo mkdir -p '$REMOTE_PATH' && sudo chown -R '$SSH_USER:$SSH_USER' '$REMOTE_PATH'"

      - name: Upload source files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'facilito-site.tar.gz' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            ./ "$SSH_USER@$VPS_HOST:$REMOTE_PATH/"

      - name: Upload build output
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            dist/ "$SSH_USER@$VPS_HOST:$REMOTE_PATH/dist/"

      - name: Restart container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$VPS_HOST" << 'EOF'
            set -euo pipefail
            cd /datos/site
            sudo chmod -R 755 dist
            sudo chown -R ubuntu:ubuntu dist

            if sudo docker compose version >/dev/null 2>&1; then
              sudo docker compose up -d --build
              sudo docker compose ps
              sudo docker compose logs --tail=20
            else
              sudo docker-compose up -d --build
              sudo docker-compose ps
              sudo docker-compose logs --tail=20
            fi
          EOF
