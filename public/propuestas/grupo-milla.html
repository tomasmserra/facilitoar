<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#030712;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;padding:1rem;-webkit-font-smoothing:antialiased;}
.wrapper{width:100%;max-width:28rem;}
.brand{text-align:center;font-weight:700;font-size:1.75rem;letter-spacing:-0.025em;margin-bottom:1.5rem;color:#fff;}
.brand .accent{color:#14b8a6;}
.card{background:#111827;border:1px solid #1f2937;border-radius:1rem;padding:2rem;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);}
.icon-wrap{display:flex;justify-content:center;margin-bottom:1rem;}
.icon-circle{display:inline-flex;align-items:center;justify-content:center;width:4rem;height:4rem;background:#0d9488;border-radius:9999px;color:#fff;}
.title{font-size:1.5rem;font-weight:700;color:#fff;text-align:center;margin-bottom:0.5rem;}
.subtitle{font-size:0.875rem;color:#9ca3af;text-align:center;margin-bottom:2rem;line-height:1.5;}
.field{margin-bottom:1.5rem;}
.label{display:block;font-size:0.875rem;font-weight:500;color:#d1d5db;margin-bottom:0.5rem;}
.input-wrap{position:relative;}
.input-wrap .lead{position:absolute;top:0;bottom:0;left:0.75rem;display:flex;align-items:center;color:#6b7280;pointer-events:none;}
input[type=password]{width:100%;padding:0.75rem 0.75rem 0.75rem 2.5rem;border-radius:0.75rem;border:1px solid #374151;background:#1f2937;color:#fff;font-size:1rem;outline:none;font-family:inherit;transition:border-color 0.2s,box-shadow 0.2s;}
input[type=password]::placeholder{color:#6b7280;}
input[type=password]:focus{border-color:transparent;box-shadow:0 0 0 2px #14b8a6;}
button.submit{width:100%;padding:0.75rem 1rem;border-radius:0.75rem;background:#0d9488;color:#fff;font-size:1rem;font-weight:700;border:none;cursor:pointer;box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);transition:background 0.15s,transform 0.05s;font-family:inherit;}
button.submit:hover{background:#14b8a6;}
button.submit:active{transform:scale(0.97);}
button.submit:focus{outline:none;box-shadow:0 0 0 2px #030712,0 0 0 4px #14b8a6;}
.err{margin-bottom:1.5rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.5);border-radius:0.75rem;padding:0.75rem 1rem;display:none;align-items:center;gap:0.75rem;color:#f87171;font-size:0.875rem;}
.err.show{display:flex;}
.err svg{flex-shrink:0;}
.footer{margin-top:1.5rem;text-align:center;color:#6b7280;font-size:0.75rem;}
.footer a{color:#9ca3af;text-decoration:none;}
.footer a:hover{color:#14b8a6;}
</style>
</head>

      </div>
    </div>

    <p class="subtitle">Este documento está protegido.<br>Ingresá la contraseña para acceder.</p>

      <label class="label" for="pwd">Contraseña</label>

          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="pwd" placeholder="Ingresá tu contraseña" autocomplete="current-password" autofocus onkeydown="if(event.key==='Enter')unlock()">
      </div>
    </div>
    <button class="submit" onclick="unlock()">Acceder</button>

function unlock() {
  const pwd = document.getElementById('pwd').value;
  if (!pwd) return;
  try {
    const dec = CryptoJS.AES.decrypt(ENC, pwd).toString(CryptoJS.enc.Utf8);
    if (!dec || dec.indexOf('<') === -1) throw new Error();
    document.open(); document.write(dec); document.close();
  } catch {
    const err = document.getElementById('err');
    err.classList.add('show');
    const pwdEl = document.getElementById('pwd');
    pwdEl.value = '';
    pwdEl.focus();
  }
}
